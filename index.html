async function boot() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return loginView();
  const [p, r, g, gi] = await Promise.all([
    db.from('profiles').select('full_name').eq('id', user.id).maybeSingle(),
    db.from('user_roles').select('role').eq('user_id', user.id),
    db.from('gyms').select('name').limit(1).maybeSingle(),
    db.from('gyms').select('info').limit(1).maybeSingle()]);
  const roles = (r.data || []).map(x => x.role), has = x => roles.includes(x);
  const modes = [];
  if (has('owner') || has('admin') || has('receptionist')) modes.push('gestao');
  if (has('owner') || has('pt')) modes.push('pt');
  if (has('member')) modes.push('membro');
  if (!modes.length) { await db.auth.signOut(); return loginView('Esta conta ainda não tem acesso. Fala com a receção.'); }
  let last = null; try { last = localStorage.getItem('mode'); } catch {}
  S = { roles, uid: user.id, name: p.data?.full_name || '', gym: g.data?.name || 'Ginásio', info: gi.error ? null : (gi.data?.info || {}), modes, mode: modes.includes(last) ? last : modes[0] };
  shell();
}

function splash() {
  const d = document.createElement('div'); d.className = 'splash'; d.setAttribute('aria-hidden', 'true');
  d.innerHTML = `<img src="${LOGO_BIG}" alt=""><p>${saud()}, ${esc(S.name.split(' ')[0])}</p>`;

function shell() {
  stopRest();
  document.body.classList.remove('is-login');
  if (!S.welcomed) { S.welcomed = true; splash(); }
  S.sec = S.sec || {};
  const items = NAV[S.mode].filter(([k]) => !(k === 'ginasio' && S.info == null) && !(k === 'config' && (S.info == null || !(S.roles.includes('owner') || S.roles.includes('admin'))))), cur = S.sec[S.mode] || items[0][0];
  const sw = S.modes.length > 1
    ? `<nav class="modes no-print" aria-label="Modo">${S.modes.map(m => `<button data-m="${m}" aria-pressed="${m === S.mode}">${MODES[m]}</button>`).join('')}</nav>` : '';
  const nav = items.length > 1
    ? `<nav id="nav" aria-label="Secções"><img class="brand" src="${LOGO}" alt="">${items.map(([k, l, i]) => `<button data-s="${k}"${k === cur ? ' aria-current="page"' : ''}><i class="ti ti-${i}" aria-hidden="true"></i><span>${l}</span></button>`).join('')}</nav>` : '';
  document.body.classList.toggle('has-nav', !!nav);
  app.innerHTML = `<div class="row no-print"><div class="who"><img class="lg" src="${LOGO}" alt=""><div><span class="mu">${esc(S.gym)}</span><h1 style="margin:0">${saud()}, ${esc(S.name.split(' ')[0])}</h1></div></div>
    <div class="hr"><span class="inst-slot hdr"></span><button class="btn ghost" id="th" aria-label="Alternar claro e escuro"><i class="ti ti-${T === 'dark' ? 'sun' : 'moon'}" aria-hidden="true"></i></button><button class="btn ghost" id="out">Sair</button></div></div>${sw}<section id="view" aria-live="polite"></section>${nav}`;
  renderInstalar();
  $id('th').onclick = () => { T = T === 'dark' ? 'light' : 'dark'; tema(T); try { localStorage.setItem('theme', T); } catch {} shell(); };
  $id('out').onclick = async () => { S = {}; await db.auth.signOut(); loginView(); };
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    S.ficha = null; S.recibo = null; S.novo = false; B = null; S.mode = b.dataset.m; try { localStorage.setItem('mode', S.mode); } catch {} shell(); });
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.ficha = null; S.recibo = null; S.novo = false; B = null; S.sec[S.mode] = b.dataset.s; shell(); });
  VIEWS[S.mode][cur]($id('view'));
}

// Cria a conta de login com um cliente temporário (não troca a sessão do staff) e depois a ficha via RPC
async function criarMembro(d) {
  const tmp = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  const phone = norm(d.phone);
  const { data, error } = await tmp.auth.signUp({ email: phone + '@membros.gym', password: d.pw });
  if (error) throw new Error(/already/i.test(error.message) ? 'Já existe um membro com este telefone.' : error.message);
  const r = await db.rpc('register_member', { p_user: data.user.id, p_name: d.name.trim(), p_phone: phone, p_pt: d.pt || null });
  if (r.error) throw r.error;
}

  el.onclick = ev => {
    const t = ev.target.closest('button'); if (!t) return; const D = t.dataset;
    if (t.id === 'bc') { S.novo = false; B = null; return treinos(el); }
    if (D.d != null) B.cur = +D.d;
    else if (t.id === 'bad') { B.days.push({ label: String.fromCharCode(65 + B.days.length), items: [] }); B.cur = B.days.length - 1; }
    else if (D.g) B.grp = D.g;
    else if (D.a) d.items.push({ ex: exs.find(e => e.id === D.a), sets: 3, reps: 12 });
    else if (D.x != null) d.items.splice(+D.x, 1);
    else return;
    bld(el, { alunos, exs });
  };
  el.oninput = ev => {
    const t = ev.target, D = t.dataset;
    if (t.id === 'bn') B.name = t.value; else if (t.id === 'ba') B.mid = t.value;
    else if (D.s != null) d.items[+D.s].sets = +t.value; else if (D.r != null) d.items[+D.r].reps = +t.value;
  };
  $id('bf').onsubmit = async ev => {
    ev.preventDefault(); const err = m => { $id('be').textContent = m; };
    const days = B.days.filter(y => y.items.length);
    if (!B.mid) return err('Escolhe o aluno.');
    if (!B.name.trim()) return err('Dá um nome ao plano.');
    if (!days.length) return err('Adiciona pelo menos um exercício.');
    ev.submitter.disabled = true;
    try { await guardarPlano(days); S.novo = false; B = null; treinos(el); }
    catch (e) { err(e.message); ev.submitter.disabled = false; }
  };
}

async function guardarPlano(days) {
  const pl = ok(await db.from('workout_plans').insert({ member_id: B.mid, pt_id: S.uid, name: B.name.trim() }).select().single());
  try {
    const ds = ok(await db.from('workout_days').insert(days.map((y, i) => ({ plan_id: pl.id, label: y.label, position: i }))).select());
    const items = days.flatMap((y, i) => y.items.map((it, j) => ({ day_id: ds.find(z => z.position === i).id, exercise_id: it.ex.id, sets: it.sets, reps: it.reps, position: j })));
    ok(await db.from('workout_items').insert(items));
  } catch (e) { await db.from('workout_plans').delete().eq('id', pl.id); throw e; }
  await db.from('workout_plans').update({ active: false }).eq('member_id', B.mid).neq('id', pl.id);
}

const u1 = (v, s) => v == null ? '—' : String(v).replace('.', ',') + s;

function linha(vals) {
  if (vals.length < 2) return '<p class="mu">São precisas pelo menos 2 avaliações para mostrar a evolução.</p>';
  const w = 300, h = 90, mn = Math.min(...vals), r = Math.max(...vals) - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (w - 20) + 10).toFixed(1)},${(h - 10 - (v - mn) / r * (h - 20)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Evolução do peso"><polyline points="${pts}" fill="none" stroke="#ff8a2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function variacao(a) {
  if (a.length < 2) return '';
  const p = a[a.length - 1], u = a[0];
  const dl = (l, k, s) => p[k] == null || u[k] == null ? '' : `<div class="card"><span class="mu">${l}</span><div class="big">${sinal(+u[k] - +p[k])}${s}</div></div>`;
  return `<h3>Desde a primeira avaliação (${new Date(p.assessed_at + 'T00:00').toLocaleDateString('pt-PT')})</h3>
    <div class="grid">${dl('Peso', 'weight_kg', ' kg')}${dl('Cintura', 'waist_cm', ' cm')}${dl('% gordura', 'body_fat_pct', ' %')}${dl('Braço', 'arm_cm', ' cm')}</div>`;
}

function resumoAval(a) {
  if (!a.length) return vazio('chart-line', 'Ainda sem avaliação física', 'É o ponto de partida: peso, medidas e % de gordura. A tua evolução aparece aqui a partir da segunda avaliação.');
  const u = a[0], imc = u.weight_kg && u.height_cm ? (u.weight_kg / ((u.height_cm / 100) ** 2)).toFixed(1).replace('.', ',') : '—';
  const c = (l, v) => `<div class="card"><span class="mu">${l}</span><div class="big">${v}</div></div>`;
  return `<p class="mu">Última avaliação: ${new Date(u.assessed_at + 'T00:00').toLocaleDateString('pt-PT')}</p>
    <div class="grid">${c('Peso', u1(u.weight_kg, ' kg'))}${c('Altura', u1(u.height_cm, ' cm'))}${c('% gordura', u1(u.body_fat_pct, ' %'))}${c('IMC', imc)}</div>
    <div class="card"><span class="mu">Medidas</span><div class="pv">Peito ${u1(u.chest_cm, '')} · Cintura ${u1(u.waist_cm, '')} · Braço ${u1(u.arm_cm, '')} · Coxa ${u1(u.thigh_cm, '')} cm</div></div>
    <div class="card"><span class="mu">Evolução do peso</span>${linha(a.filter(x => x.weight_kg != null).map(x => +x.weight_kg).reverse())}</div>${variacao(a)}`;
}

// ===== Progresso: pesagens e ânimo do aluno =====
const MOOD = [['mood-sad', 'Em baixo'], ['mood-neutral', 'Normal'], ['mood-smile', 'Bem'], ['mood-happy', 'Em forma']];
const oculta = () => { try { return localStorage.getItem('ocultaPeso') === '1'; } catch { return false; } };

// pontos = pesagens; linha laranja = tendência (média dos últimos 7 dias), que é o que interessa
function tendencia(rows) {
  const w = 300, h = 120, px = 12, py = 14, ts = rows.map(r => ud(r.d).getTime()), t0 = ts[0], t1 = ts[ts.length - 1];
  const mn = Math.min(...rows.map(r => r.w)), span = (Math.max(...rows.map(r => r.w)) - mn) || 1;
  const X = t => px + (t1 === t0 ? .5 : (t - t0) / (t1 - t0)) * (w - 2 * px), Y = v => h - py - (v - mn) / span * (h - 2 * py);
  const tr = rows.map((r, i) => { const win = rows.filter((q, j) => ts[j] <= ts[i] && ts[j] > ts[i] - 7 * 864e5); return X(ts[i]).toFixed(1) + ',' + Y(win.reduce((s, q) => s + q.w, 0) / win.length).toFixed(1); });
  const dots = rows.map((r, i) => `<circle cx="${X(ts[i]).toFixed(1)}" cy="${Y(r.w).toFixed(1)}" r="3" fill="currentColor" opacity=".35"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Evolução do peso: os pontos são as pesagens e a linha laranja é a tendência dos últimos 7 dias">${dots}${tr.length > 1 ? `<polyline points="${tr.join(' ')}" fill="none" stroke="#ff8a2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>` : ''}</svg>`;
}

function listaRegistos(rows, apagar) {
  if (!rows.length) return '';
  return `<div class="card"><h3 style="margin:0 0 6px">Últimos registos</h3>${rows.slice(0, 8).map(r => {
    const md = MOOD[r.mood - 1];
    return `<div class="rg t"><span>${dm(r.logged_on)}</span><span class="pv">${r.weight_kg != null ? f1(+r.weight_kg) + ' kg' : '—'}${r.waist_cm != null ? ' · cintura ' + f1(+r.waist_cm) + ' cm' : ''}</span><span class="mu">${md ? `<i class="ti ti-${md[0]}" aria-hidden="true"></i> ${md[1]}` : ''}</span>${apagar ? `<button class="rm" type="button" data-id="${r.id}" aria-label="Apagar o registo de ${dm(r.logged_on)}"><i class="ti ti-trash" aria-hidden="true"></i></button>` : ''}</div>`;
  }).join('')}</div>`;
}

function pesos(rows) { // rows vêm da mais recente para a mais antiga
  return rows.filter(r => r.weight_kg != null).map(r => ({ d: r.logged_on, w: +r.weight_kg })).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
}

function pesagens(rows, comOcultar) {
  const ws = pesos(rows);
  if (!ws.length) return vazio('scale', 'Ainda sem pesagens', 'Quando te pesares, regista aqui o número. Em poucas semanas vês a tua tendência.');
  const hd = dia(new Date()), seg = addD(hd, -((ud(hd).getUTCDay() + 6) % 7));
  const med = (a, b) => { const v = ws.filter(r => r.d >= a && r.d < b).map(r => r.w); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const m1 = med(seg, addD(seg, 7)), m0 = med(addD(seg, -7), seg);
  const resumo = m1 != null && m0 != null ? `<p style="margin:12px 0 0">Média desta semana <strong class="pv">${f1(m1)} kg</strong> · semana passada <strong class="pv">${f1(m0)} kg</strong> · diferença <strong class="pv">${sinal(m1 - m0)} kg</strong></p>` : '';
  return `<div class="card"><div class="row"><h3 style="margin:0">As minhas pesagens</h3>${comOcultar ? `<button class="btn ghost" id="ob" type="button" aria-pressed="${oculta()}">${oculta() ? 'Mostrar números' : 'Esconder números'}</button>` : ''}</div>
    ${ws.length >= 2 ? `<div class="mu" style="margin-top:8px">${tendencia(ws.slice(-90))}</div>
      <p class="mu" style="margin:4px 0 0;font-size:14px">Os pontos são as pesagens. A linha é a tendência dos últimos 7 dias, e é ela que conta: o peso sobe e desce naturalmente de dia para dia.</p>` : '<p class="mu" style="margin:8px 0 0">Com 2 ou mais pesagens vês aqui a tua tendência.</p>'}
    ${resumo}</div>${listaRegistos(rows, comOcultar)}`;
}

function corpoStaff(rows, ePt) {
  if (!rows.length) return '<h3>Pesagens e ânimo</h3><p class="mu">' + (ePt ? 'O aluno ainda não registou pesagens no app.' : 'Privado: só o aluno e o seu Personal Trainer veem as pesagens e o ânimo.') + '</p>';
  const ws = pesos(rows);
  return `<h3>Pesagens e ânimo (registados pelo aluno)</h3>${ws.length >= 2 ? `<div class="card mu">${tendencia(ws.slice(-90))}</div>` : ''}${listaRegistos(rows)}`;
}

async function carregaMembro() {
  const { data: m, error } = await db.from('member_status').select('*').eq('profile_id', S.uid).maybeSingle();
  if (error) throw error;
  if (!m) return null;
  const desde = new Date(Date.now() - 120 * 864e5).toISOString();
  const [pl, lg, sb, av, bl, tt, pr] = await Promise.all([
    db.from('workout_plans').select('name, created_at, workout_days(id, label, position, workout_items(sets, reps, position, exercises(name, muscle_group, video_url)))')
      .eq('member_id', m.member_id).eq('active', true).order('created_at', { ascending: false }).limit(1),
    db.from('workout_logs').select('day_id, done_at').eq('member_id', m.member_id).gte('done_at', desde).order('done_at', { ascending: false }).limit(500),
    db.from('subscriptions').select('start_date, end_date').eq('member_id', m.member_id).order('end_date', { ascending: false }).limit(1),
    db.from('assessments').select('assessed_at, weight_kg').eq('member_id', m.member_id).not('weight_kg', 'is', null).order('assessed_at', { ascending: true }).limit(24),
    db.from('body_logs').select('logged_on, weight_kg, waist_cm, mood').eq('member_id', m.member_id).order('logged_on', { ascending: false }).order('created_at', { ascending: false }).limit(120),
    db.from('workout_logs').select('id', { count: 'exact', head: true }).eq('member_id', m.member_id),
    db.rpc('my_plan_price')]);
  if (pl.error || lg.error) throw pl.error || lg.error;
  const plan = pl.data[0] || null, days = plan ? plan.workout_days.sort(pos) : [];
  days.forEach(d => d.workout_items.sort(pos));
  const logs = lg.data || [], last = logs[0], i = last ? days.findIndex(d => d.id === last.day_id) : -1;
  const hd = dia(new Date()), feito = !!last && dia(last.done_at) === hd && i >= 0;
  const sub = sb.data?.[0], dd = s => new Date(s + 'T00:00');
  const ciclo = sub ? { left: Math.round((dd(sub.end_date) - dd(hd)) / 864e5) + 1, total: Math.round((dd(sub.end_date) - dd(sub.start_date)) / 864e5) + 1 } : null;

  // consistência: dias com treino na semana (segunda a domingo), treinos no mês, semanas seguidas
  const treinados = new Set(logs.map(l => dia(l.done_at)));
  const dow = (ud(hd).getUTCDay() + 6) % 7, seg = addD(hd, -dow);
  const semana = Array.from({ length: 7 }, (_, k) => { const d = addD(seg, k); return { d, on: treinados.has(d), td: d === hd }; });
  const nSem = semana.filter(x => x.on).length;
  let streak = 0; // semanas seguidas com treino; a semana em curso só conta se já treinou, mas nunca quebra a sequência
  for (let w = nSem ? 0 : 1; w < 17; w++) {
    const a = addD(seg, -7 * w);
    if (![0, 1, 2, 3, 4, 5, 6].some(k => treinados.has(addD(a, k)))) break;
    streak++;
  }
  const aval = (av.data || []).map(x => ({ d: x.assessed_at, w: +x.weight_kg }));
  const corpo = bl.error ? null : (bl.data || []); // null = tabela ainda não existe: o app esconde a funcionalidade
  const pontos = [...aval, ...(corpo || []).filter(x => x.weight_kg != null).map(x => ({ d: x.logged_on, w: +x.weight_kg }))].sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  return {
    m, plan, days, feito, ciclo, semana, nSem, streak, hd,
    meta: Math.min(6, Math.max(2, days.length || 3)),
    mes: logs.filter(l => dia(l.done_at).startsWith(hd.slice(0, 7))).length,
    ultimo: last ? dia(last.done_at) : null,
    corpo, pontos, total: tt.count || 0, preco: pr.error || !pr.data || pr.data.preco == null ? null : +pr.data.preco, planoDesde: plan ? plan.created_at : null,
    hoje: days.length ? days[feito ? i : (i + 1) % days.length] : null };
}

let REST = null;
function stopRest() { if (REST) { clearInterval(REST.t); REST = null; } document.querySelector('.rest')?.remove(); }
function startRest(sec) {
  stopRest();
  const box = document.createElement('div'); box.className = 'rest'; box.setAttribute('role', 'timer');
  box.innerHTML = '<div><span class="hl">Descanso</span><strong class="rt">0:00</strong></div><div class="hbs"><button class="btn ghost" data-r="15">+15 s</button><button class="btn" data-r="0">Saltar</button></div>';
  document.body.appendChild(box);
  REST = { end: Date.now() + sec * 1000, box };
  const tick = () => {
    const left = Math.ceil((REST.end - Date.now()) / 1000), rt = box.querySelector('.rt');
    if (left <= 0) {
      try { navigator.vibrate?.([200, 100, 200]); } catch {}
      rt.textContent = 'Pronto!'; clearInterval(REST.t);
      setTimeout(() => { if (REST && REST.box === box) stopRest(); }, 2500); return;
    }
    rt.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  };
  REST.t = setInterval(tick, 250); tick();
  box.onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; if (b.dataset.r === '0') stopRest(); else REST.end += 15000; };
}

function celebra({ label, sem, meta, mes }) {
  const o = document.createElement('div'); o.className = 'cele'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); o.setAttribute('aria-label', 'Treino concluído');
  const cores = ['#ff8a2a', '#1f6fc2', '#ffffff', '#5fd6c2'];
  const conf = Array.from({ length: 22 }, (_, k) => `<s style="left:${(k * 37) % 100}%;background:${cores[k % 4]};animation-delay:${(k % 7) * .15}s;animation-duration:${2.2 + (k % 5) * .3}s"></s>`).join('');
  o.innerHTML = `<div class="cf" aria-hidden="true">${conf}</div><div class="cb"><span class="ck"><i class="ti ti-check" aria-hidden="true"></i></span>
    <h2>Treino ${esc(label)} concluído</h2>
    <p>${esc(S.name.split(' ')[0])}, ${sem >= meta ? 'meta da semana cumprida. Isto é consistência.' : 'mais um treino feito. É assim que se constrói o resultado.'}</p>
    <div class="stats"><div><strong>${sem} de ${meta}</strong><span>esta semana</span></div><div><strong>${mes}</strong><span>este mês</span></div></div>
    <button class="btn" id="cx">Continuar</button></div>`;
  document.body.appendChild(o);
  const x = $id('cx'); x.focus(); x.onclick = () => o.remove();
  o.onkeydown = e => { if (e.key === 'Escape') o.remove(); };
}

async function treinoM(el) {
  let D; try { D = await carregaMembro(); } catch (e) { return el.innerHTML = fail(e); }
  if (!D || !D.plan || !D.days.length) return el.innerHTML = '<h2>O meu treino</h2>' + vazio('barbell', 'O teu plano está a ser preparado', 'Assim que o teu PT atribuir o teu plano de treino, ele aparece aqui, pronto a seguir exercício a exercício.');
  if (!D.days.some(d => d.id === S.dia)) S.dia = D.hoje.id;
  const d = D.days.find(x => x.id === S.dia), key = chkKey(d.id), feitos = lerChk(key), n = d.workout_items.length;
  el.innerHTML = `<h2>O meu treino</h2><p class="mu">${esc(D.plan.name)}</p>
    <nav class="modes">${D.days.map(x => `<button data-d="${x.id}" aria-pressed="${x.id === S.dia}">Treino ${esc(x.label)}</button>`).join('')}</nav>
    <div class="card"><div class="row"><strong id="pg"></strong><span class="mu">${esc(gruposDe(d))}</span></div><div class="bar" style="margin-top:10px"><i id="pb"></i></div></div>
    <div class="list">${d.workout_items.map((i, k) => `<div class="card ex" data-k="${k}" role="checkbox" aria-checked="false" tabindex="0">
      <span class="tick"><i class="ti ti-check" aria-hidden="true"></i></span>
      <div style="flex:1;min-width:0"><strong>${esc(i.exercises?.name)}</strong><br><span class="mu">${esc(i.exercises?.muscle_group)}</span>
      ${/^https?:\/\//.test(i.exercises?.video_url || '') ? ` · <a href="${esc(i.exercises.video_url)}" target="_blank" rel="noopener">vídeo</a>` : ''}</div>
      <strong>${i.sets} × ${i.reps}</strong></div>`).join('')}</div>
    <p class="err" id="ce"></p><button class="btn" id="cc" style="width:100%">Concluir treino</button>`;
  const cards = [...el.querySelectorAll('.ex')];
  const pinta = () => {
    cards.forEach((c, k) => { c.classList.toggle('done', feitos.has(k)); c.setAttribute('aria-checked', feitos.has(k)); });
    $id('pb').style.width = (n ? feitos.size / n * 100 : 0) + '%';
    $id('pg').textContent = `${feitos.size} de ${n} exercício${n === 1 ? '' : 's'}`;
    $id('cc').textContent = n && feitos.size === n ? 'Concluir treino · tudo feito' : 'Concluir treino';
  };
  pinta();
  const flip = c => {
    if (!c) return;
    const k = +c.dataset.k, on = !feitos.has(k);
    on ? feitos.add(k) : feitos.delete(k);
    gravaChk(key, feitos); pinta();
    if (on && feitos.size < n) startRest(60); else stopRest();
  };
  const lista = el.querySelector('.list');
  lista.onclick = ev => { if (!ev.target.closest('a')) flip(ev.target.closest('.ex')); };
  lista.onkeydown = ev => { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); flip(ev.target.closest('.ex')); } };
  el.querySelector('.modes').onclick = ev => { const b = ev.target.closest('[data-d]'); if (b) { stopRest(); S.dia = b.dataset.d; treinoM(el); } };
  $id('cc').onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true;
    const { error } = await db.from('workout_logs').insert({ member_id: D.m.member_id, day_id: d.id });
    if (error) { $id('ce').textContent = error.message; b.disabled = false; return; }
    stopRest(); try { localStorage.removeItem(key); } catch {}
    const sem = D.nSem + (D.semana.some(x => x.td && x.on) ? 0 : 1);
    S.dia = null; ir('inicio'); celebra({ label: d.label, sem, meta: D.meta, mes: D.mes + 1 });
  };
}

async function pagM(el) {
  const { data: m, error } = await db.from('member_status').select('member_id, plan_name, end_date, status, full_name, code').eq('profile_id', S.uid).maybeSingle();
  if (error) return el.innerHTML = fail(error);
  if (!m) return el.innerHTML = '<p class="mu">Ainda não tens ficha de membro.</p>';
  const [pq, pr] = await Promise.all([db.from('payments').select('id, receipt_no, amount, method, paid_at, plans(name)')
    .eq('member_id', m.member_id).order('paid_at', { ascending: false }).limit(20), db.rpc('my_plan_price')]);
  const { data: ps, error: e2 } = pq;
  if (e2) return el.innerHTML = fail(e2);
  const preco = pr.error || !pr.data || pr.data.preco == null ? null : +pr.data.preco;
  const info = S.info || {}, pg = info.pagamento || {};
  const wz = waLink(info.whatsapp, `Olá! Segue o comprovativo do pagamento da mensalidade. Nome: ${m.full_name || S.name}. Código: ${m.code}.`);
  const como = pg.iban || pg.instrucoes
    ? `<div class="card"><span class="mu">Como pagar${info.exemplo ? ' · dados de exemplo' : ''}</span>
      ${pg.instrucoes ? `<p style="margin:6px 0 10px">${esc(pg.instrucoes)}</p>` : ''}
      ${pg.iban ? `<div class="rg"><span class="mu">${esc(pg.banco || 'IBAN')}${pg.titular ? ' · ' + esc(pg.titular) : ''}</span></div><div class="rg"><strong style="overflow-wrap:anywhere">${esc(pg.iban)}</strong><button class="btn ghost" id="cp" type="button">Copiar</button></div>` : ''}
      ${wz ? `<a class="btn" style="margin-top:10px" href="${esc(wz)}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i>Enviar comprovativo</a>` : ''}</div>`
    : '<div class="card"><span class="mu">Como pagar</span><p style="margin:6px 0 0">Paga na receção, por transferência bancária ou por Multicaixa Express. A receção regista o pagamento e a tua mensalidade é atualizada.</p></div>';
  el.innerHTML = `<h2>Pagamentos</h2><div class="card"><span class="mu">Mensalidade · ${m.status === 'expired' ? 'venceu' : 'vence'} em ${dm(m.end_date)}</span>
      <div class="big">${m.plan_name ? esc(m.plan_name) : 'Sem plano'}</div>${preco != null ? `<div class="mu">${m.status === 'active' ? 'Valor da mensalidade' : 'Valor a pagar'}: <strong>${kz(preco)}</strong></div>` : ''}</div>
    ${como}
    <h3>Histórico</h3><div class="list">${ps.length ? ps.map(p => `<div class="card row"><div><strong>${rno(p)}</strong><br><span class="mu">${esc(p.plans?.name || '')} · ${METODO[p.method]} · ${dh(p.paid_at)}</span></div>
      <strong>${kz(p.amount)}</strong></div>`).join('') : vazio('receipt', 'Ainda sem pagamentos', 'Quando a receção registar o teu primeiro pagamento, o recibo aparece aqui.')}</div>`;
  if ($id('cp')) $id('cp').onclick = async () => { try { await navigator.clipboard.writeText(pg.iban); $id('cp').textContent = 'Copiado'; } catch { $id('cp').textContent = 'Seleciona e copia'; } };
}

// Se a sessão mudar noutro separador (outro utilizador a entrar), esta página reflete o utilizador real
db.auth.onAuthStateChange((_e, s) => {
  if (S.uid && (!s || s.user.id !== S.uid)) setTimeout(() => s ? boot() : loginView(), 0);
});

const VIEWS = { gestao: { dash, planos, membros, faturacao, config }, pt: { alunos: pt, exercicios, treinos }, membro: { inicio: membro, treino: treinoM, avaliacao: avalM, pagamentos: pagM, ginasio: ginasioM } };

db.auth.getSession().then(({ data }) => data.session ? boot() : loginView());
</script>
