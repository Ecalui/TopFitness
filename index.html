<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d2038">
<title>GymApp</title>
<style>
:root{--bg:#12161a;--card:#1f2327;--line:#363c42;--tx:#f2f4f0;--mu:#9aa3a8;--lime:#c8f533;--warn:#f5b84a;--bad:#ff7a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:28px;margin:4px 0 16px}
label{display:block;color:var(--mu)}
input{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;margin:6px 0 14px}
.card{background:var(--card);border-radius:20px;padding:16px 20px;margin-bottom:12px}
.mu{color:var(--mu)}
.btn{width:100%;background:var(--lime);color:#12161a;border:0;border-radius:18px;padding:16px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line);font-weight:400;width:auto;padding:10px 16px;font-size:16px}
.modes{display:flex;gap:8px;overflow-x:auto;margin:0 0 20px}
.modes button{flex:none;background:none;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--lime);color:#12161a;border-color:var(--lime);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.grid .card{margin:0}
.big{font-size:28px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag{border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap}
.active{background:#2c3a12;color:var(--lime)}
.expiring,.none{background:#3d2d12;color:var(--warn)}
.expired,.suspended{background:#3d1f1b;color:var(--bad)}
.err{color:var(--bad);min-height:1.4em;margin:0 0 8px}
select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;margin:6px 0 14px}
#fl{width:auto;margin:0}
h3{margin:0 0 12px}
.chk{display:flex;align-items:center;margin-bottom:14px}
.chk input{width:auto;margin:0 10px 0 0}
.ok{color:var(--lime)}
[hidden]{display:none!important}
/* mobile */
:root{color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.row>div{min-width:0;overflow-wrap:anywhere}
.big{font-size:clamp(20px,6.5vw,28px);overflow-wrap:anywhere}
.modes{scrollbar-width:none;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.btn,.modes button,select,input{min-height:48px}
.chk input{min-height:0;width:22px;height:22px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:380px){main{padding:20px 14px 32px}h1{font-size:24px}.card{padding:14px 16px}}
/* layout híbrido: barra em baixo (telemóvel), ícones (tablet), menu lateral (computador) */
main{max-width:1100px}
.btn{width:auto;padding:12px 22px;min-height:44px;border-radius:14px;font-size:16px}
form .btn{display:block;margin-left:auto}
.login{max-width:420px;margin:8vh auto}
.login .btn{width:100%}
form.card{max-width:520px}
#ml,.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:12px}
#ml .card,.list .card{margin:0}
#nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;cursor:pointer;min-height:48px}
#nav i{font-size:22px}
#nav button[aria-current=page]{color:var(--lime);font-weight:700}
body.has-nav main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){
#nav{top:0;right:auto;bottom:0;width:76px;flex-direction:column;justify-content:flex-start;gap:6px;padding:16px 8px;border-top:0;border-right:1px solid var(--line)}
body.has-nav{padding-left:76px}
body.has-nav main{padding-bottom:40px}
}
@media(min-width:1024px){
#nav{width:224px;padding:20px 12px}
#nav button{flex:none;flex-direction:row;gap:12px;font-size:16px;padding:12px 14px;border-radius:14px;justify-content:flex-start}
#nav button[aria-current=page]{background:var(--lime);color:#12161a}
body.has-nav{padding-left:224px}
}
.row .btn{white-space:nowrap}
.kv{padding:10px 0;border-bottom:1px solid var(--line)}
@media(min-width:640px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{.no-print,#nav{display:none!important}body,body.has-nav{background:#fff;color:#000;padding:0!important}.card{background:#fff;color:#000;border:1px solid #999}.mu{color:#444}h2{color:#000}}
.sr{display:flex;align-items:center;gap:6px}
.sr input{width:64px;min-height:44px;margin:0;text-align:center}
.sr .btn{padding:8px 14px}
details.card summary{cursor:pointer}
details ul{margin:8px 0;padding-left:20px}
.grid.g2{grid-template-columns:1fr}
@media(min-width:640px){.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}#nav button{flex:none}}
.av{width:56px;height:56px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.open{cursor:pointer}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
/* tema azul e laranja (claro por defeito, escuro opcional) */
:root{--bg:#edf3f9;--card:#fff;--line:#d5e0ec;--tx:#10243a;--mu:#62758a;--ac:#ff8a2a;--acx:#1b1208;--lime:var(--ac);--sb:#0d2038;--sbtx:#a9b8c9;--okb:#d9f4ef;--okt:#127a68;--wb:#ffe6cf;--wt:#c4610f;--bb:#fde0dc;--bt:#c23b2e;--warn:#c4610f;--bad:#c23b2e;--hero:linear-gradient(135deg,#1f6fc2,#0d2038);--sh:0 1px 2px rgba(16,36,58,.06),0 6px 18px rgba(16,36,58,.07);color-scheme:light}
[data-theme=dark]{--bg:#0b1624;--card:#13243a;--line:#243a55;--tx:#eef3f9;--mu:#9bb0c6;--sb:#081322;--okb:#12403b;--okt:#5fd6c2;--wb:#4a2f14;--wt:#ffb26b;--bb:#4a1f1b;--bt:#ff8f84;--warn:#ffb26b;--bad:#ff8f84;--sh:none;color-scheme:dark}
.card{box-shadow:var(--sh)}
.btn{color:var(--acx)}
.btn.ghost{color:var(--tx)}
.modes button[aria-pressed=true]{color:var(--acx)}
.active{background:var(--okb);color:var(--okt)}
.expiring,.none{background:var(--wb);color:var(--wt)}
.expired,.suspended{background:var(--bb);color:var(--bt)}
.ok{color:var(--okt)}
.login{margin:4vh auto}
.lhero{background:var(--hero);border-radius:24px;padding:24px;text-align:center;margin-bottom:14px}
.lhero img{width:120px;height:120px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lhero p{color:#fff;margin:12px 0 0}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.lg{width:48px;height:48px;border-radius:14px;flex:none}
.hr{display:flex;gap:8px;align-items:center}
.hr .btn{padding:10px 14px}
#nav{background:var(--sb);border-color:transparent}
#nav button{color:var(--sbtx)}
#nav button[aria-current=page]{color:var(--ac)}
#nav .brand{display:none;width:44px;height:44px;border-radius:12px;margin:0 auto 10px}
@media(min-width:640px){#nav .brand{display:block}}
@media(min-width:1024px){#nav .brand{width:64px;height:64px;border-radius:16px;margin:0 0 14px 14px}#nav button[aria-current=page]{background:var(--ac);color:var(--acx)}}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px;box-shadow:var(--sh)}
.hl{display:block;opacity:.8}
.hv{font-size:clamp(26px,7vw,38px);font-weight:700;overflow-wrap:anywhere}
.hbs{display:flex;gap:8px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
.ki{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:20px;margin-bottom:8px}
.ki.b{background:#dcecff;color:#1f6fc2}.ki.o{background:#ffe6cf;color:#c4610f}.ki.t{background:#d9f4ef;color:#127a68}
[data-theme=dark] .ki.b{background:#183a5e;color:#7db8f0}[data-theme=dark] .ki.o{background:#4a2f14;color:#ffb26b}[data-theme=dark] .ki.t{background:#12403b;color:#5fd6c2}
.av{background:#dcecff;color:#1f6fc2}
[data-theme=dark] .av{background:#183a5e;color:#7db8f0}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
</style>

document.head.insertAdjacentHTML('beforeend', `<link rel="icon" href="${LOGO}"><link rel="apple-touch-icon" href="${LOGO}">`);
let T = 'light'; try { T = localStorage.getItem('theme') || 'light'; } catch {}
const tema = t => { document.documentElement.dataset.theme = t; document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0b1624' : '#0d2038'; };
tema(T);
const $id = x => document.getElementById(x);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = v => { const d = v.replace(/\D/g, ''); return d.length > 9 && d.startsWith('244') ? d.slice(3) : d; };
const kz = n => new Intl.NumberFormat('pt-AO').format(n) + ' Kz';
const dm = d => d ? new Date(d + 'T00:00').toLocaleDateString('pt-PT', {day:'2-digit', month:'2-digit'}) : '—';
const STATE = {active:'Ativo', expiring:'A expirar', expired:'Expirado', suspended:'Suspenso', none:'Sem plano'};
const MODES = {gestao:'Gestão', pt:'Personal Trainer', membro:'Meu perfil'};
let S = {};

function loginView(msg = '') {
  document.body.classList.remove('has-nav');
  app.innerHTML = `<div class="login"><div class="lhero"><img src="${LOGO}" alt="Ginásio Top Fitness"><p>Gestão de membros, treinos e pagamentos</p></div><div class="card"><h1>Entrar</h1>
    <p class="mu">Membros entram com o telefone. A equipa pode usar o email.</p>
    <label>Telefone ou email<input id="id" autocomplete="username"></label>
    <label>Palavra-passe<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err" role="alert">${esc(msg)}</p>
    <button class="btn" id="go">Entrar</button></div></div>`;
  $id('go').onclick = async () => {
    const v = $id('id').value.trim();
    if (!v.includes('@') && /[^\d\s+()-]/.test(v)) return loginView('Escreve só o número de telefone (ex.: 990000011) ou o email, não o nome.');
    const email = v.includes('@') ? v : norm(v) + '@membros.gym';
    const { error } = await db.auth.signInWithPassword({ email, password: $id('pw').value });
    error ? loginView('Não foi possível entrar (' + email + '): ' + error.message) : boot();
  };
}

async function boot() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return loginView();
  const [p, r, g] = await Promise.all([
    db.from('profiles').select('full_name').eq('id', user.id).maybeSingle(),
    db.from('user_roles').select('role').eq('user_id', user.id),
    db.from('gyms').select('name').limit(1).maybeSingle()]);
  const roles = (r.data || []).map(x => x.role), has = x => roles.includes(x);
  const modes = [];
  if (has('owner') || has('admin') || has('receptionist')) modes.push('gestao');
  if (has('owner') || has('pt')) modes.push('pt');
  if (has('member')) modes.push('membro');
  if (!modes.length) { await db.auth.signOut(); return loginView('Esta conta ainda não tem acesso. Fala com a receção.'); }
  let last = null; try { last = localStorage.getItem('mode'); } catch {}
  S = { roles, uid: user.id, name: p.data?.full_name || '', gym: g.data?.name || 'Ginásio', modes, mode: modes.includes(last) ? last : modes[0] };
  shell();
}

const NAV = {
  gestao: [['dash', 'Painel', 'layout-dashboard'], ['planos', 'Planos', 'tags'], ['membros', 'Membros', 'users'], ['faturacao', 'Faturação', 'receipt']],
  pt: [['alunos', 'Alunos', 'users'], ['exercicios', 'Exercícios', 'barbell'], ['treinos', 'Treinos', 'clipboard-list']],
  membro: [['inicio', 'Início', 'home'], ['treino', 'Treino', 'barbell'], ['avaliacao', 'Avaliação', 'chart-line'], ['pagamentos', 'Pagamentos', 'receipt']]};

function shell() {
  S.sec = S.sec || {};
  const items = NAV[S.mode], cur = S.sec[S.mode] || items[0][0];
  const sw = S.modes.length > 1
    ? `<nav class="modes no-print" aria-label="Modo">${S.modes.map(m => `<button data-m="${m}" aria-pressed="${m === S.mode}">${MODES[m]}</button>`).join('')}</nav>` : '';
  const nav = items.length > 1
    ? `<nav id="nav" aria-label="Secções"><img class="brand" src="${LOGO}" alt="">${items.map(([k, l, i]) => `<button data-s="${k}"${k === cur ? ' aria-current="page"' : ''}><i class="ti ti-${i}" aria-hidden="true"></i><span>${l}</span></button>`).join('')}</nav>` : '';
  document.body.classList.toggle('has-nav', !!nav);
  app.innerHTML = `<div class="row no-print"><div class="who"><img class="lg" src="${LOGO}" alt=""><div><span class="mu">${esc(S.gym)}</span><h1 style="margin:0">Olá, ${esc(S.name.split(' ')[0])}</h1></div></div>
    <div class="hr"><button class="btn ghost" id="th" aria-label="Alternar claro e escuro"><i class="ti ti-${T === 'dark' ? 'sun' : 'moon'}" aria-hidden="true"></i></button><button class="btn ghost" id="out">Sair</button></div></div>${sw}<section id="view" aria-live="polite"></section>${nav}`;
  $id('th').onclick = () => { T = T === 'dark' ? 'light' : 'dark'; tema(T); try { localStorage.setItem('theme', T); } catch {} shell(); };
  $id('out').onclick = async () => { S = {}; await db.auth.signOut(); loginView(); };
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    S.ficha = null; S.recibo = null; S.novo = false; B = null; S.mode = b.dataset.m; try { localStorage.setItem('mode', S.mode); } catch {} shell(); });
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.ficha = null; S.recibo = null; S.novo = false; B = null; S.sec[S.mode] = b.dataset.s; shell(); });
  VIEWS[S.mode][cur]($id('view'));
}

const fail = e => `<p class="err">Não foi possível carregar: ${esc(e.message)}</p>`;
const soon = t => `<p class="mu">A seguir neste modo: ${esc(t)}</p>`;

async function dash(el) {
  const { data, error } = await db.rpc('dashboard_stats');
  if (error) return el.innerHTML = fail(error);
  const hoje = new Date().toLocaleDateString('pt-PT', { timeZone: 'Africa/Luanda', weekday: 'long', day: 'numeric', month: 'long' });
  const k = (ic, cor, v, l) => `<div class="card"><span class="ki ${cor}"><i class="ti ti-${ic}" aria-hidden="true"></i></span><div class="big">${v}</div><span class="mu">${l}</span></div>`;
  el.innerHTML = `<div class="hero"><div><span style="text-transform:capitalize;opacity:.8">${hoje}</span><span class="hl">Receita do mês</span><div class="hv">${kz(data.revenue_month)}</div></div>
    <div class="hbs"><button class="btn" id="hp">Registar pagamento</button><button class="btn ghost" id="hm">Novo membro</button></div></div>
    <div class="grid g3">${k('users', 'b', data.active, 'Membros ativos')}${k('clock-exclamation', 'o', data.expiring_7d, 'Expiram em 7 dias')}${k('door-enter', 't', data.checkins_today, 'Entradas hoje')}</div>`;
  $id('hp').onclick = () => ir('faturacao');
  $id('hm').onclick = () => { S.novoM = true; ir('membros'); };
}

async function faturacao(el) {
  if (S.recibo) return recibo(el);
  const [pay, m, pl] = await Promise.all([
    db.from('payments').select(PSEL, { count: 'exact' }).order('paid_at', { ascending: false }).limit(200),
    db.from('member_status').select('member_id, full_name, phone, status').order('full_name'),
    db.from('plans').select('*').eq('active', true).order('price')]);
  const e = pay.error || m.error || pl.error; if (e) return el.innerHTML = fail(e);
  const recebido = pay.data.filter(p => ym(p.paid_at) === ym(new Date())).reduce((s, p) => s + +p.amount, 0);
  const c = (l, v) => `<div class="card"><span class="mu">${l}</span><div class="big">${v}</div></div>`;
  const pre = S.prefill; S.prefill = null;
  el.innerHTML = `<div class="grid g3">${c('Recebido no mês', kz(recebido))}${c('Membros em atraso', m.data.filter(x => x.status === 'expired').length)}${c('Recibos emitidos', pay.count ?? pay.data.length)}</div>
    <form id="pf2" class="card"><h3>Registar pagamento</h3>
      <label>Membro<select name="m" required><option value="">Escolher…</option>${m.data.map(x => `<option value="${x.member_id}"${x.member_id === pre ? ' selected' : ''}>${esc(x.full_name)} · ${esc(x.phone || '')}</option>`).join('')}</select></label>
      <label>Plano<select name="p" required><option value="">Escolher…</option>${pl.data.map(x => `<option value="${x.id}" data-price="${x.price}">${esc(x.name)} · ${kz(x.price)}</option>`).join('')}</select></label>
      <label>Método<select name="t">${Object.entries(METODO).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label>Valor (Kz)<input name="a" type="number" min="0" required></label>
      <p class="err" id="fe"></p><button class="btn">Registar e emitir recibo</button></form>
    <h2>Pagamentos recentes</h2>
    <div class="list" id="pl">${pay.data.length ? pay.data.slice(0, 30).map(p => `<div class="card row"><div><strong>${rno(p)}</strong> · ${esc(nome(p))}<br>
      <span class="mu">${esc(p.plans?.name || '')} · ${METODO[p.method]} · ${dh(p.paid_at)}</span></div>
      <div style="text-align:right"><strong>${kz(p.amount)}</strong><br><button class="btn ghost" data-v="${p.id}">Ver recibo</button></div></div>`).join('')
      : '<p class="mu">Ainda não há pagamentos.</p>'}</div>`;
  const F = $id('pf2').elements;
  F.p.onchange = () => { F.a.value = F.p.selectedOptions[0]?.dataset.price || ''; };
  $id('pl').onclick = ev => { const b = ev.target.closest('[data-v]'); if (b) { S.recibo = b.dataset.v; faturacao(el); } };
  $id('pf2').onsubmit = async ev => {
    ev.preventDefault(); const btn = ev.submitter; btn.disabled = true; $id('fe').textContent = '';
    const { data, error } = await db.rpc('register_payment', { p_member: F.m.value, p_plan: F.p.value, p_method: F.t.value, p_amount: +F.a.value });
    if (error) { $id('fe').textContent = error.message; btn.disabled = false; } else { S.recibo = data.id; faturacao(el); }
  };
}

async function recibo(el) {
  const { data: p, error } = await db.from('payments').select(PSEL).eq('id', S.recibo).single();
  if (error) { S.recibo = null; return el.innerHTML = fail(error); }
  const k = (a, b) => `<div class="row kv"><span class="mu">${a}</span><strong>${esc(b)}</strong></div>`;

// Cria a conta de login com um cliente temporário (não troca a sessão do staff) e depois a ficha via RPC
async function criarMembro(d) {
  const tmp = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  const phone = norm(d.phone);
  const { data, error } = await tmp.auth.signUp({ email: phone + '@membros.gym', password: d.pw });
  if (error) throw new Error(/already/i.test(error.message) ? 'Já existe um membro com este telefone.' : error.message);
  const r = await db.rpc('register_member', { p_user: data.user.id, p_name: d.name.trim(), p_phone: phone, p_pt: d.pt || null });
  if (r.error) throw r.error;
}

function bld(el, { alunos, exs }) {
  const d = B.days[B.cur], rows = exs.filter(e => B.grp === 'Todos' || e.muscle_group === B.grp);
  el.innerHTML = `<form class="card" id="bf"><h3>Novo plano de treino</h3>
      <label>Aluno<select id="ba"><option value="">Escolher…</option>${alunos.map(m => `<option value="${m.member_id}"${m.member_id === B.mid ? ' selected' : ''}>${esc(m.full_name)}</option>`).join('')}</select></label>
      <label>Nome do plano<input id="bn" value="${esc(B.name)}" placeholder="Ex.: Hipertrofia ABC"></label>
      <nav class="modes">${B.days.map((y, i) => `<button type="button" data-d="${i}" aria-pressed="${i === B.cur}">Treino ${y.label}</button>`).join('')}<button type="button" id="bad">+ Treino</button></nav>
      ${d.items.length ? d.items.map((it, i) => `<div class="card row"><div><strong>${esc(it.ex.name)}</strong><br><span class="mu">${esc(it.ex.muscle_group)}</span></div>
        <div class="sr"><input data-s="${i}" type="number" min="1" value="${it.sets}" aria-label="Séries"> × <input data-r="${i}" type="number" min="1" value="${it.reps}" aria-label="Repetições">
        <button type="button" class="btn ghost" data-x="${i}" aria-label="Remover">×</button></div></div>`).join('') : '<p class="mu">Sem exercícios neste treino. Adiciona da biblioteca abaixo.</p>'}
      <p class="err" id="be"></p><button class="btn">Guardar e atribuir</button>
      <button type="button" class="btn ghost" id="bc" style="margin-top:8px">Cancelar</button></form>
    <h3>Biblioteca</h3><nav class="modes">${['Todos', ...GRUPOS].map(g => `<button data-g="${g}" aria-pressed="${g === B.grp}">${g}</button>`).join('')}</nav>
    <div class="list">${rows.map(e => `<div class="card row"><div><strong>${esc(e.name)}</strong><br><span class="mu">${esc(e.muscle_group)}</span></div>
      <button class="btn" data-a="${e.id}" aria-label="Adicionar ${esc(e.name)}">+</button></div>`).join('') || '<p class="mu">Biblioteca vazia. Cria exercícios no separador Exercícios.</p>'}</div>`;
  el.onclick = ev => {
    const t = ev.target.closest('button'); if (!t) return; const D = t.dataset;
    if (t.id === 'bc') { S.novo = false; B = null; return treinos(el); }
    if (D.d != null) B.cur = +D.d;
    else if (t.id === 'bad') { B.days.push({ label: String.fromCharCode(65 + B.days.length), items: [] }); B.cur = B.days.length - 1; }
    else if (D.g) B.grp = D.g;
    else if (D.a) d.items.push({ ex: exs.find(e => e.id === D.a), sets: 3, reps: 12 });
    else if (D.x != null) d.items.splice(+D.x, 1);
    else return;
    bld(el, { alunos, exs });
  };
  el.oninput = ev => {
    const t = ev.target, D = t.dataset;
    if (t.id === 'bn') B.name = t.value; else if (t.id === 'ba') B.mid = t.value;
    else if (D.s != null) d.items[+D.s].sets = +t.value; else if (D.r != null) d.items[+D.r].reps = +t.value;
  };
  $id('bf').onsubmit = async ev => {
    ev.preventDefault(); const err = m => { $id('be').textContent = m; };
    const days = B.days.filter(y => y.items.length);
    if (!B.mid) return err('Escolhe o aluno.');
    if (!B.name.trim()) return err('Dá um nome ao plano.');
    if (!days.length) return err('Adiciona pelo menos um exercício.');
    ev.submitter.disabled = true;
    try { await guardarPlano(days); S.novo = false; B = null; treinos(el); }
    catch (e) { err(e.message); ev.submitter.disabled = false; }
  };
}

async function guardarPlano(days) {
  const pl = ok(await db.from('workout_plans').insert({ member_id: B.mid, pt_id: S.uid, name: B.name.trim() }).select().single());
  try {
    const ds = ok(await db.from('workout_days').insert(days.map((y, i) => ({ plan_id: pl.id, label: y.label, position: i }))).select());
    const items = days.flatMap((y, i) => y.items.map((it, j) => ({ day_id: ds.find(z => z.position === i).id, exercise_id: it.ex.id, sets: it.sets, reps: it.reps, position: j })));
    ok(await db.from('workout_items').insert(items));
  } catch (e) { await db.from('workout_plans').delete().eq('id', pl.id); throw e; }
  await db.from('workout_plans').update({ active: false }).eq('member_id', B.mid).neq('id', pl.id);
}

const u1 = (v, s) => v == null ? '—' : String(v).replace('.', ',') + s;

function linha(vals) {
  if (vals.length < 2) return '<p class="mu">São precisas pelo menos 2 avaliações para mostrar a evolução.</p>';
  const w = 300, h = 90, mn = Math.min(...vals), r = Math.max(...vals) - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (w - 20) + 10).toFixed(1)},${(h - 10 - (v - mn) / r * (h - 20)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Evolução do peso"><polyline points="${pts}" fill="none" stroke="#ff8a2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function resumoAval(a) {
  if (!a.length) return '<p class="mu">Ainda não há avaliações físicas.</p>';
  const u = a[0], imc = u.weight_kg && u.height_cm ? (u.weight_kg / ((u.height_cm / 100) ** 2)).toFixed(1).replace('.', ',') : '—';
  const c = (l, v) => `<div class="card"><span class="mu">${l}</span><div class="big">${v}</div></div>`;
  return `<p class="mu">Última avaliação: ${new Date(u.assessed_at + 'T00:00').toLocaleDateString('pt-PT')}</p>
    <div class="grid">${c('Peso', u1(u.weight_kg, ' kg'))}${c('Altura', u1(u.height_cm, ' cm'))}${c('% gordura', u1(u.body_fat_pct, ' %'))}${c('IMC', imc)}</div>
    <div class="card"><span class="mu">Medidas</span><div>Peito ${u1(u.chest_cm, '')} · Cintura ${u1(u.waist_cm, '')} · Braço ${u1(u.arm_cm, '')} · Coxa ${u1(u.thigh_cm, '')} cm</div></div>
    <div class="card"><span class="mu">Evolução do peso</span>${linha(a.filter(x => x.weight_kg != null).map(x => +x.weight_kg).reverse())}</div>`;
}

  if (!m) return null;
  const [pl, lg, sb] = await Promise.all([
    db.from('workout_plans').select('name, workout_days(id, label, position, workout_items(sets, reps, position, exercises(name, muscle_group, video_url)))')
      .eq('member_id', m.member_id).eq('active', true).order('created_at', { ascending: false }).limit(1),
    db.from('workout_logs').select('day_id, done_at').eq('member_id', m.member_id).order('done_at', { ascending: false }).limit(1),
    db.from('subscriptions').select('start_date, end_date').eq('member_id', m.member_id).order('end_date', { ascending: false }).limit(1)]);
  if (pl.error || lg.error) throw pl.error || lg.error;
  const plan = pl.data[0] || null, days = plan ? plan.workout_days.sort(pos) : [];
  days.forEach(d => d.workout_items.sort(pos));
  const last = lg.data[0], i = last ? days.findIndex(d => d.id === last.day_id) : -1;
  const feito = !!last && dia(last.done_at) === dia(new Date()) && i >= 0;
  const sub = sb.data?.[0], dd = s => new Date(s + 'T00:00');
  const ciclo = sub ? { left: Math.round((dd(sub.end_date) - dd(dia(new Date()))) / 864e5) + 1, total: Math.round((dd(sub.end_date) - dd(sub.start_date)) / 864e5) + 1 } : null;
  return { m, plan, days, feito, ciclo, hoje: days.length ? days[feito ? i : (i + 1) % days.length] : null };
}

function anel(left, total) {
  const r = 42, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, left / (total || 1)));
  return `<svg viewBox="0 0 100 100" width="112" height="112" role="img" aria-label="${Math.max(0, left)} dias restantes"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#ff8a2a" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>
    <text x="50" y="53" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">${Math.max(0, left)}</text><text x="50" y="69" text-anchor="middle" font-size="10" fill="#fff" opacity=".8">dias</text></svg>`;
}

async function membro(el) {
  let D; try { D = await carregaMembro(); } catch (e) { return el.innerHTML = fail(e); }
  if (!D) return el.innerHTML = '<p class="mu">Ainda não tens ficha de membro.</p>';
  const { m, hoje, feito, ciclo } = D, flash = S.flashM ? `<p class="ok" role="status">${esc(S.flashM)}</p>` : ''; S.flashM = '';
  el.innerHTML = `${flash}<div class="hero" style="justify-content:flex-start"><div>${ciclo ? anel(ciclo.left, ciclo.total) : ''}</div>
      <div style="flex:1;min-width:0"><span class="hl">Mensalidade</span><div class="hv" style="font-size:24px">${esc(m.plan_name || 'Sem plano')}</div>
      <span class="tag ${m.status}">${STATE[m.status]}</span> <span style="opacity:.85">renova em ${dm(m.end_date)}</span></div></div>
    <div class="grid g2"><div class="card"><span class="mu">O teu código de acesso</span><div class="big">${esc(m.code)}</div></div></div>
    <div class="card"><span class="mu">Treino de hoje</span>
      ${hoje ? `<div><strong>Treino ${esc(hoje.label)}</strong>${gruposDe(hoje) ? ' · ' + esc(gruposDe(hoje)) : ''}${feito ? ' · concluído' : ''}</div>
        <button class="btn ghost" id="vt" style="margin-top:10px">Ver treino</button>` : '<div class="mu">Ainda não tens plano de treino. Fala com o teu PT.</div>'}</div></div>
    ${['expired', 'expiring', 'none'].includes(m.status) ? '<button class="btn" id="rn">Renovar mensalidade</button>' : ''}`;
  if ($id('vt')) $id('vt').onclick = () => ir('treino');
  if ($id('rn')) $id('rn').onclick = () => ir('pagamentos');
}

async function treinoM(el) {
  let D; try { D = await carregaMembro(); } catch (e) { return el.innerHTML = fail(e); }
  if (!D || !D.plan) return el.innerHTML = '<h2>O meu treino</h2><p class="mu">Ainda não tens plano de treino. Fala com o teu PT.</p>';
  if (!D.days.some(d => d.id === S.dia)) S.dia = D.hoje.id;
  const d = D.days.find(x => x.id === S.dia);
  el.innerHTML = `<h2>O meu treino</h2><p class="mu">${esc(D.plan.name)}</p>
    <nav class="modes">${D.days.map(x => `<button data-d="${x.id}" aria-pressed="${x.id === S.dia}">Treino ${esc(x.label)}</button>`).join('')}</nav>
    <div class="list">${d.workout_items.map(i => `<div class="card row"><div><strong>${esc(i.exercises?.name)}</strong><br><span class="mu">${esc(i.exercises?.muscle_group)}</span>
      ${/^https?:\/\//.test(i.exercises?.video_url || '') ? ` · <a href="${esc(i.exercises.video_url)}" target="_blank" rel="noopener">vídeo</a>` : ''}</div>
      <strong>${i.sets} × ${i.reps}</strong></div>`).join('')}</div>
    <p class="err" id="ce"></p><button class="btn" id="cc">Concluir treino</button>`;
  el.querySelector('.modes').onclick = ev => { const b = ev.target.closest('[data-d]'); if (b) { S.dia = b.dataset.d; treinoM(el); } };
  $id('cc').onclick = async ev => {
    ev.target.disabled = true;
    const { error } = await db.from('workout_logs').insert({ member_id: D.m.member_id, day_id: d.id });
    if (error) { $id('ce').textContent = error.message; ev.target.disabled = false; }
    else { S.flashM = `Treino ${d.label} concluído. Bom trabalho!`; S.dia = null; ir('inicio'); }
  };
}

async function pagM(el) {
  const { data: m, error } = await db.from('member_status').select('member_id, plan_name, end_date, status').eq('profile_id', S.uid).maybeSingle();
  if (error) return el.innerHTML = fail(error);
  if (!m) return el.innerHTML = '<p class="mu">Ainda não tens ficha de membro.</p>';
  const { data: ps, error: e2 } = await db.from('payments').select('id, receipt_no, amount, method, paid_at, plans(name)')
    .eq('member_id', m.member_id).order('paid_at', { ascending: false }).limit(20);
  if (e2) return el.innerHTML = fail(e2);
  el.innerHTML = `<h2>Pagamentos</h2><div class="card"><span class="mu">Mensalidade · ${m.status === 'expired' ? 'venceu' : 'vence'} em ${dm(m.end_date)}</span>
      <div class="big">${m.plan_name ? esc(m.plan_name) : 'Sem plano'}</div></div>
    <div class="card"><span class="mu">Como pagar</span><p style="margin:6px 0 0">Paga na receção, por transferência bancária ou por Multicaixa Express. A receção regista o pagamento e a tua mensalidade é atualizada.</p></div>
    <h3>Histórico</h3><div class="list">${ps.length ? ps.map(p => `<div class="card row"><div><strong>${rno(p)}</strong><br><span class="mu">${esc(p.plans?.name || '')} · ${METODO[p.method]} · ${dh(p.paid_at)}</span></div>
      <strong>${kz(p.amount)}</strong></div>`).join('') : '<p class="mu">Ainda não há pagamentos.</p>'}</div>`;
}

// Se a sessão mudar noutro separador (outro utilizador a entrar), esta página reflete o utilizador real
db.auth.onAuthStateChange((_e, s) => {
  if (S.uid && (!s || s.user.id !== S.uid)) setTimeout(() => s ? boot() : loginView(), 0);
});

const VIEWS = { gestao: { dash, planos, membros, faturacao }, pt: { alunos: pt, exercicios, treinos }, membro: { inicio: membro, treino: treinoM, avaliacao: avalM, pagamentos: pagM } };

db.auth.getSession().then(({ data }) => data.session ? boot() : loginView());
</script>
</body>
